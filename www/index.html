<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="description" content="SuperEssence Sheets — le tableur des coachs sportifs, par SuperEssence Studio">
  <title>SuperEssence Sheets</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Écran de démarrage -->
  <div id="splash">
    <div class="splash-logo"><span class="w">Super</span><span class="y">Essence</span><span class="y">.</span></div>
    <div class="splash-sub">SHEETS · STUDIO</div>
    <div class="splash-bar"><i></i></div>
  </div>

  <!-- Accueil -->
  <section id="home" class="screen">
    <header class="home-head">
      <div class="brand"><span class="w">Super</span><span class="y">Essence</span><span class="y">.</span><small>Sheets</small></div>
      <button class="icon-btn" data-act="settings" title="Paramètres"></button>
    </header>
    <div class="home-body">
      <div class="hero">
        <h1>Le tableur des <em>coachs</em>.</h1>
        <p>Programmes, suivis, charges, allures : un vrai tableur, taillé pour le sport.</p>
        <div class="hero-actions">
          <button class="btn primary" data-act="wizard"></button>
          <button class="btn" data-act="newBlank"></button>
          <button class="btn" data-act="import"></button>
        </div>
      </div>
      <h2 class="sec-title">Modèles</h2>
      <div id="tplGrid" class="tpl-grid"></div>
      <h2 class="sec-title">Mes classeurs <span id="fileCount"></span></h2>
      <div id="fileList" class="file-list"></div>
      <footer class="home-foot">SuperEssence Sheets · une application <b>SuperEssence Studio</b></footer>
    </div>
  </section>

  <!-- Éditeur -->
  <section id="editor" class="screen hidden">
    <header class="topbar">
      <button class="icon-btn" data-act="home" title="Accueil"></button>
      <input id="wbName" class="wb-name" spellcheck="false">
      <span id="saveState" class="save-state"></span>
      <div class="spacer-flex"></div>
      <button class="icon-btn" data-act="undo" title="Annuler (Ctrl+Z)"></button>
      <button class="icon-btn" data-act="redo" title="Rétablir (Ctrl+Y)"></button>
      <button class="icon-btn accent" data-act="exportMenu" title="Exporter / partager"></button>
    </header>
    <nav class="ribbon-tabs" id="ribbonTabs"></nav>
    <div class="ribbon" id="ribbon"></div>
    <div class="formula-bar">
      <input id="nameBox" class="name-box" spellcheck="false" autocomplete="off">
      <button class="fx-btn" data-act="functions" title="Insérer une fonction">fx</button>
      <input id="formulaInput" class="formula-input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Saisissez une valeur ou une formule (=SOMME(A1:A5))">
      <button class="icon-btn small hidden" id="fbOk" data-act="commit"></button>
      <button class="icon-btn small hidden" id="fbCancel" data-act="cancelEdit"></button>
    </div>
    <div class="grid-wrap" id="gridWrap">
      <div id="fnHint" class="fn-hint hidden"></div>
      <canvas></canvas>
      <div class="scroller"><div class="spacer"><div class="chart-layer"></div></div></div>
      <textarea id="cellEditor" class="cell-editor hidden" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <footer class="sheetbar">
      <button class="icon-btn small" data-act="addSheet" title="Nouvelle feuille"></button>
      <div class="sheet-tabs" id="sheetTabs"></div>
      <div class="status" id="status"></div>
    </footer>
    <button class="fab" data-act="timer" title="Chrono / minuteur"></button>
  </section>

  <input type="file" id="fileInput" accept=".xlsx,.csv,.sess,.json,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden">
  <div id="overlay" class="overlay hidden"></div>
  <div id="toasts" class="toasts"></div>

  <script src="vendor/exceljs.min.js" defer></script>
  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="js/icons.js"></script>
  <script src="js/formula.js"></script>
  <script src="js/model.js"></script>
  <script src="js/sport.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/io.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
